<title>Pennywise — Live App</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<style>
  :root {
    --s-bg:#f5f6f8; --s-surface:#fff; --s-sunken:#eef0f3;
    --s-ink:#0f1417; --s-ink2:#5b6570; --s-ink3:#98a1ac;
    --s-border:transparent; --s-divider:#edeff2;
    --s-brand:#0b7a5b; --s-on-brand:#fff; --s-neg:#e5484d; --s-pos:#12a277;
    --s-shadow:0 6px 16px -8px rgba(15,20,23,.18);
    --s-tabbar:rgba(255,255,255,.94);
    --page:#e7ebe9;
  }
  .dark {
    --s-bg:#0a0c0e; --s-surface:#14181b; --s-sunken:#0f1315;
    --s-ink:#f4f6f7; --s-ink2:#9aa4ad; --s-ink3:#5f6a72;
    --s-border:#242a2f; --s-divider:#1e2429;
    --s-brand:#16b487; --s-on-brand:#04140f; --s-neg:#ff6369; --s-pos:#2ed3a3;
    --s-shadow:none; --s-tabbar:rgba(20,24,27,.96);
  }
  @media (prefers-color-scheme: dark) { :root:not(.light) { --page:#08090b; } }

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; }
  body {
    background:var(--page);
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; color:var(--s-ink);
    min-height:100vh;
  }

  /* Mobile-first: content flows in the normal document, tab bar is fixed.
     No dependence on dvh/flex-height, so it renders in any browser or viewer. */
  #app {
    position:relative; width:100%; max-width:480px; margin:0 auto;
    background:var(--s-bg); color:var(--s-ink); min-height:100vh;
  }
  .statusbar{ height:44px; display:flex; align-items:flex-end; justify-content:space-between;
    padding:0 24px 5px; font-size:13px; font-weight:700; }
  .statusbar .icns{ display:flex; gap:6px; align-items:center; } .statusbar svg{ width:16px;height:16px; }
  .content{ padding:4px 16px 108px; }
  .content::-webkit-scrollbar{ display:none; }

  /* Desktop: render inside a phone frame with its own internal scroll. */
  @media (min-width:520px){
    body{ background:
      radial-gradient(900px 600px at 20% -10%, rgba(11,122,91,.16), transparent 60%),
      radial-gradient(700px 500px at 100% 0%, rgba(18,162,119,.12), transparent 55%),
      var(--page); padding:24px; display:flex; align-items:center; justify-content:center; }
    #app{ max-width:412px; height:min(880px,94vh); min-height:0; overflow:hidden;
      display:flex; flex-direction:column; border-radius:44px; border:11px solid #14171a;
      box-shadow:0 40px 80px -30px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.04) inset; }
    .content{ flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }
  }

  .row{ display:flex; align-items:center; } .between{ justify-content:space-between; }
  .title{ font-size:25px; font-weight:800; letter-spacing:-.02em; }
  .h{ font-size:16px; font-weight:700; letter-spacing:-.01em; }
  .sub{ font-size:12.5px; color:var(--s-ink2); font-weight:600; }
  .tiny{ font-size:11px; color:var(--s-ink3); font-weight:600; }
  .tnum{ font-variant-numeric:tabular-nums; }
  .grow{ flex:1; } .brand{ color:var(--s-brand); }

  .iconbtn{ width:42px;height:42px;border-radius:21px;background:var(--s-surface);display:grid;place-items:center;
    border:1px solid var(--s-border); box-shadow:var(--s-shadow); cursor:pointer; }
  .iconbtn svg{ width:20px;height:20px;color:var(--s-ink); }

  .card{ background:var(--s-surface); border-radius:22px; padding:16px; border:1px solid var(--s-border); box-shadow:var(--s-shadow); }
  .mt{ margin-top:13px; }

  .chipico{ width:44px;height:44px;border-radius:15px;display:grid;place-items:center;flex:none; }
  .chipico svg{ width:22px;height:22px; }
  .chipico.sm{ width:40px;height:40px;border-radius:14px; } .chipico.sm svg{ width:20px;height:20px; }

  .hero-amt{ font-size:42px;font-weight:800;letter-spacing:-.03em;margin-top:4px; }
  .pill{ display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--s-sunken);font-size:11px;font-weight:700;color:var(--s-ink2); }
  .pill svg{ width:12px;height:12px; }
  .track{ height:10px;border-radius:5px;background:var(--s-sunken);overflow:hidden; } .track.sm{ height:6px; }
  .track>i{ display:block;height:100%;border-radius:5px;background:var(--s-brand);transition:width .5s cubic-bezier(.2,.7,.2,1); }

  .tiles{ display:flex;gap:10px; }
  .tile{ flex:1;background:var(--s-surface);border-radius:18px;padding:12px;border:1px solid var(--s-border);box-shadow:var(--s-shadow); }
  .tile .ic{ width:28px;height:28px;border-radius:9px;background:var(--s-sunken);display:grid;place-items:center;margin-bottom:9px; } .tile .ic svg{ width:15px;height:15px; }
  .tile .v{ font-size:15px;font-weight:800;letter-spacing:-.02em;margin-top:2px; }

  .bars{ display:flex;align-items:flex-end;gap:12px;height:96px; }
  .bars .b{ flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%; }
  .bars .b i{ width:64%;border-radius:7px;background:var(--s-brand);transition:height .5s cubic-bezier(.2,.7,.2,1);min-height:3px; }
  .barlabels{ display:flex;gap:12px;margin-top:7px; } .barlabels span{ flex:1;text-align:center;font-size:10.5px;color:var(--s-ink3);font-weight:600; }

  .lrow{ display:flex;align-items:center;gap:12px;padding:11px 0;cursor:pointer; }
  .lrow+.lrow{ border-top:1px solid var(--s-divider); }
  .lrow .nm{ font-size:14.5px;font-weight:650; } .lrow .amt{ font-size:15px;font-weight:700; }
  .lrow:active{ opacity:.55; }

  .seg{ display:flex;background:var(--s-sunken);border-radius:14px;padding:4px; }
  .seg>div{ flex:1;text-align:center;padding:9px;border-radius:11px;font-size:13px;font-weight:700;color:var(--s-ink2);cursor:pointer; }
  .seg>div.on{ background:var(--s-surface);color:var(--s-ink);box-shadow:var(--s-shadow); }

  .field{ display:flex;align-items:center;gap:8px;background:var(--s-surface);border:1px solid var(--s-border);border-radius:15px;height:46px;padding:0 12px;box-shadow:var(--s-shadow); }
  .field svg{ width:17px;height:17px;color:var(--s-ink3); }
  .field input{ flex:1;border:none;background:transparent;color:var(--s-ink);font-size:15px;font-weight:600;font-family:inherit;outline:none;min-width:0; }
  .field input::placeholder{ color:var(--s-ink3); }

  .sechead{ font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--s-ink2);margin:0 4px 8px; }
  .empty{ text-align:center;padding:30px 10px; }
  .empty .circ{ width:70px;height:70px;border-radius:35px;background:color-mix(in srgb,var(--s-brand) 16%,transparent);display:grid;place-items:center;margin:0 auto 16px; }
  .empty .circ svg{ width:32px;height:32px;color:var(--s-brand); }

  /* tab bar */
  .tabbar{ position:fixed;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom);
    background:var(--s-tabbar);border-top:1px solid var(--s-divider);backdrop-filter:blur(14px);z-index:20; }
  .tabinner{ max-width:480px;margin:0 auto;height:74px;display:flex;align-items:center; }
  @media (min-width:520px){ .tabbar{ position:absolute; } .tabinner{ max-width:none; } }
  .tab{ flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding-bottom:8px;cursor:pointer; }
  .tab svg{ width:23px;height:23px;color:var(--s-ink3); } .tab span{ font-size:10px;font-weight:700;color:var(--s-ink3); }
  .tab.on svg,.tab.on span{ color:var(--s-brand); }
  .fab{ width:56px;height:56px;border-radius:20px;flex:none;margin:-26px 6px 0;background:var(--s-brand);display:grid;place-items:center;cursor:pointer;
    box-shadow:0 12px 22px -8px rgba(11,122,91,.75); transition:transform .12s; }
  .fab:active{ transform:scale(.92); } .fab svg{ width:30px;height:30px;color:var(--s-on-brand); }

  /* modal */
  .overlay{ position:fixed;inset:0;background:rgba(10,14,17,.45);z-index:40;display:flex;flex-direction:column;justify-content:flex-end;animation:fade .2s ease; }
  @media (min-width:520px){ .overlay{ position:absolute; } }
  .dark .overlay{ background:rgba(0,0,0,.62); }
  .sheet{ background:var(--s-bg);border-top-left-radius:28px;border-top-right-radius:28px;max-height:96%;display:flex;flex-direction:column;animation:up .28s cubic-bezier(.2,.75,.2,1); }
  .sheet.full{ height:100%;border-radius:0; }
  @keyframes up{ from{ transform:translateY(100%); } } @keyframes fade{ from{ opacity:0; } }

  .headerbar{ display:flex;align-items:center;justify-content:space-between;padding:16px 18px 4px; }
  .headerbar .x{ font-size:15px;font-weight:600;color:var(--s-ink2);cursor:pointer; }
  .headerbar svg{ width:20px;height:20px; }

  .amount-display{ text-align:center;padding:20px 0 12px; }
  .amount-display .cur{ font-size:24px;font-weight:700;color:var(--s-ink2);vertical-align:14px;margin-right:3px; }
  .amount-display .val{ font-size:50px;font-weight:800;letter-spacing:-.03em; }
  .amount-display.empty0 .val{ color:var(--s-ink3); }

  .catrow{ display:flex;gap:12px;overflow-x:auto;padding:4px 18px 8px;scrollbar-width:none; } .catrow::-webkit-scrollbar{ display:none; }
  .catpick{ width:64px;flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer; }
  .catpick .ring{ padding:3px;border-radius:19px;border:2px solid transparent; }
  .catpick.on .ring{ border-color:var(--s-brand); }
  .catpick span{ font-size:10px;font-weight:600;color:var(--s-ink3);text-align:center;line-height:1.1; }
  .catpick.on span{ color:var(--s-ink); }

  .keypad{ display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:6px 18px 0; }
  .keypad button{ height:52px;border:none;background:transparent;color:var(--s-ink);font-size:24px;font-weight:600;border-radius:14px;font-family:inherit;cursor:pointer; }
  .keypad button:active{ background:var(--s-sunken); } .keypad button svg{ width:24px;height:24px; }
  .cta{ height:52px;border-radius:16px;background:var(--s-brand);color:var(--s-on-brand);display:grid;place-items:center;font-weight:700;font-size:16px;cursor:pointer;
    box-shadow:0 10px 20px -8px rgba(11,122,91,.6);transition:transform .12s; margin:8px 18px 0; }
  .cta:active{ transform:scale(.985); } .cta.off{ opacity:.4;pointer-events:none;box-shadow:none; }
  .btn2{ height:52px;border-radius:16px;background:var(--s-sunken);color:var(--s-ink);display:grid;place-items:center;font-weight:700;font-size:16px;cursor:pointer;flex:none;width:120px; }

  .donut-wrap{ display:grid;place-items:center;padding:8px 0 12px;position:relative; }
  .donut-center{ position:absolute;text-align:center; }
  .donut-center .l{ font-size:10.5px;color:var(--s-ink3);font-weight:700; } .donut-center .v{ font-size:26px;font-weight:800;letter-spacing:-.02em; }

  .settingsrow{ display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:56px;border-bottom:1px solid var(--s-divider); }
  .settingsrow:last-child{ border-bottom:none; } .settingsrow svg{ width:20px;height:20px;color:var(--s-ink2); }
  .settingsrow .lbl{ flex:1;font-size:15px;font-weight:600; }
  .settingsrow input{ border:none;background:transparent;text-align:right;font-size:15px;font-weight:600;color:var(--s-ink);font-family:inherit;outline:none;max-width:150px; }
  .mrow{ display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--s-divider);cursor:pointer; }
  .mrow:last-child{ border-bottom:none; } .mrow .lbl{ flex:1;font-size:15px;font-weight:600; }
  .mrow>svg{ width:18px;height:18px;color:var(--s-ink3); }
  .picktile{ width:46px;height:46px;border-radius:14px;display:grid;place-items:center;cursor:pointer;border:2px solid transparent; }
  .picktile svg{ width:22px;height:22px; }
  .swatch{ width:34px;height:34px;border-radius:17px;cursor:pointer;border:3px solid transparent; }
  .curgrid{ display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px; }
  .curbtn{ padding:10px 14px;border-radius:12px;background:var(--s-sunken);font-size:14px;font-weight:700;cursor:pointer;color:var(--s-ink); }
  .curbtn.on{ background:var(--s-brand);color:var(--s-on-brand); }
  .danger{ color:var(--s-neg)!important; } .danger svg{ color:var(--s-neg)!important; }

  .toast{ position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--s-ink);color:var(--s-bg);
    padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:700;z-index:60;display:flex;align-items:center;gap:7px;
    box-shadow:0 10px 30px -8px rgba(0,0,0,.4);animation:toast 2.2s ease forwards; }
  .toast svg{ width:16px;height:16px; }
  @keyframes toast{ 0%{ opacity:0;transform:translate(-50%,10px); } 12%,80%{ opacity:1;transform:translate(-50%,0); } 100%{ opacity:0;transform:translate(-50%,6px); } }

  @media (prefers-reduced-motion:reduce){ *{ animation-duration:.001s!important;transition-duration:.001s!important; } }
</style>

  // ---------------- data export / import ----------------
  function download(filename,text,mime){ try{ var blob=new Blob([text],{type:mime||'application/octet-stream'}); var url=URL.createObjectURL(blob); var a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },120); return true; }catch(e){ return false; } }
  function exportJSON(){ var ok=download('pennywise-backup-'+iso(new Date())+'.json', JSON.stringify(state,null,2), 'application/json'); toast(ok?'Backup downloaded':'Blocked — use Copy instead'); }
  function csvEsc(s){ s=String(s==null?'':s); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
  function exportCSV(){ var rows=[['Date','Type','Category','Account','To Account','Note','Amount']];
    state.transactions.forEach(function(t){ rows.push([t.date,t.type, t.type==='transfer'?'':getCat(t.categoryId).name, getAccount(t.accountId).name, t.type==='transfer'?getAccount(t.toAccountId).name:'', t.note||'', t.amount]); });
    var csv=rows.map(function(r){ return r.map(csvEsc).join(','); }).join('\n');
    var ok=download('pennywise-transactions-'+iso(new Date())+'.csv', csv, 'text/csv'); toast(ok?'CSV downloaded':'Download blocked'); }
  function copyJSON(){ var txt=JSON.stringify(state); if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){toast('Backup copied');},function(){toast('Copy failed');}); } else { toast('Copy not supported here'); } }
  function restoreState(obj){ if(!obj||!obj.transactions||!obj.settings){ toast('Not a valid backup'); return; } state=obj;
    if(!state.categories)state.categories=copyCats(); if(!state.accounts)state.accounts=defaultAccounts(false); if(!state.recurring)state.recurring=[];
    rebuildCat(); save(); ui.modal=null; ui.tab='home'; unlocked=true; render(); toast('Data restored'); }
  function pickFile(){ var inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
    inp.onchange=function(){ var f=inp.files&&inp.files[0]; if(!f)return; var rd=new FileReader(); rd.onload=function(){ try{ restoreState(JSON.parse(String(rd.result))); }catch(e){ toast('Could not read file'); } }; rd.readAsText(f); };
    document.body.appendChild(inp); inp.click(); setTimeout(function(){ if(inp.parentNode)inp.parentNode.removeChild(inp); },60000); }

      rec={type:'transfer',amount:amt,accountId:draft.accountId,toAccountId:draft.toAccountId,note:(draft.note||'').trim(),date:draft.date};
    } else {
      rec={type:draft.type,amount:amt,categoryId:draft.categoryId,accountId:draft.accountId,note:(draft.note||'').trim(),date:draft.date};
    }
    if(ui.modal==='edit'){ var idx=state.transactions.findIndex(function(x){return x.id===draft.id;}); if(idx>=0){ rec.id=draft.id; rec.createdAt=draft.createdAt; state.transactions[idx]=rec; } }

  document.addEventListener('click',function(e){

        if(ui.modal==='catedit'){ ui.modal=(ui.catReturn==='add'?'add':'cats'); render(); }
        else if(ui.modal==='cats'){ ui.modal='settings'; render(); }

      case 'pickacctype': { var an=document.querySelector('[data-inp="accname"]'); if(an)accDraft.name=an.value; var ao=document.querySelector('[data-inp="accopen"]'); if(ao)accDraft.opening=Math.round(+ao.value||0); var tt=ACC_TYPES.find(function(x){return x[0]===a;}); accDraft.type=a; accDraft.icon=tt?tt[2]:'wallet'; render(); break; }
      case 'accpickcolor': { var an2=document.querySelector('[data-inp="accname"]'); if(an2)accDraft.name=an2.value; var ao2=document.querySelector('[data-inp="accopen"]'); if(ao2)accDraft.opening=Math.round(+ao2.value||0); accDraft.color=a; render(); break; }
      case 'accsave': {
        var nm=document.querySelector('[data-inp="accname"]'); if(nm)accDraft.name=nm.value;
        var opn=document.querySelector('[data-inp="accopen"]'); if(opn)accDraft.opening=Math.round(+opn.value||0);
        accDraft.name=(accDraft.name||'').trim()||'Account';
        if(accDraft.isNew){ state.accounts.push({id:'a'+uid(),name:accDraft.name,type:accDraft.type,icon:accDraft.icon,color:accDraft.color,opening:accDraft.opening}); }
        else { var ac=getAccount(accDraft.id); ac.name=accDraft.name; ac.type=accDraft.type; ac.icon=accDraft.icon; ac.color=accDraft.color; ac.opening=accDraft.opening; }
        save(); ui.modal='accounts'; render(); toast('Account saved'); break;
      }
      case 'accdelete': {
        if(state.accounts.length<=1){ toast('Keep at least one account'); break; }
        var delId=accDraft.id, other=state.accounts.find(function(x){return x.id!==delId;});
        state.transactions.forEach(function(t){ if(t.accountId===delId)t.accountId=other.id; if(t.toAccountId===delId)t.toAccountId=other.id; });
        state.recurring.forEach(function(r){ if(r.accountId===delId)r.accountId=other.id; });
        state.accounts=state.accounts.filter(function(x){return x.id!==delId;});
        save(); ui.modal='accounts'; render(); toast('Account deleted'); break;
      }
      case 'recur': ui.mgrReturn=(ui.modal==='settings'?'settings':null); ui.modal='recurring'; render(); break;
      case 'recuredit': { var r0=state.recurring.find(function(x){return x.id===a;}); if(!r0)break; recDraft={isNew:false,id:r0.id,type:r0.type,amount:String(r0.amount),categoryId:r0.categoryId,accountId:r0.accountId,note:r0.note,freq:r0.freq,nextDate:r0.nextDate}; ui.recReturn=(ui.modal==='recurring'?'recurring':'home'); ui.modal='recedit'; render(); break; }
      case 'newrecur': { recDraft={isNew:true,id:null,type:'expense',amount:'',categoryId:(catList('expense')[0]||{id:'other'}).id,accountId:state.accounts[0].id,note:'',freq:'monthly',nextDate:nextDue(1)}; ui.recReturn='recurring'; ui.modal='recedit'; render(); break; }
      case 'rtype': { syncRec(); if(recDraft.type!==a){ recDraft.type=a; var lst=catList(a); if(!lst.some(function(c){return c.id===recDraft.categoryId;}))recDraft.categoryId=(lst[0]||{id:'other'}).id; } render(); break; }
      case 'rfreq': { syncRec(); recDraft.freq=a; render(); break; }
      case 'pickrcat': { syncRec(); recDraft.categoryId=a; render(); break; }
      case 'pickracc': { syncRec(); recDraft.accountId=a; render(); break; }
      case 'rdate': { syncRec(); var rd=parseISO(recDraft.nextDate); rd.setDate(rd.getDate()+(+a)); if(sod(rd)<sod(new Date()))break; recDraft.nextDate=iso(rd); render(); break; }
      case 'recsave': {
        syncRec(); var ra=Math.round(+recDraft.amount||0); if(!(ra>0)){ toast('Enter an amount'); break; }
        var obj={type:recDraft.type,amount:ra,categoryId:recDraft.categoryId,accountId:recDraft.accountId,note:(recDraft.note||'').trim(),freq:recDraft.freq,nextDate:recDraft.nextDate};
        if(recDraft.isNew){ obj.id=uid(); state.recurring.push(obj); } else { var ri=state.recurring.findIndex(function(x){return x.id===recDraft.id;}); if(ri>=0){ obj.id=recDraft.id; state.recurring[ri]=obj; } }
        save(); ui.modal='recurring'; render(); toast('Recurring saved'); break;
      }
      case 'recdelete': { state.recurring=state.recurring.filter(function(x){return x.id!==recDraft.id;}); save(); ui.modal='recurring'; render(); toast('Recurring deleted'); break; }
      case 'backup': ui.modal='backup'; render(); break;
      case 'importdata': ui.modal='import'; render(); break;
      case 'exportjson': exportJSON(); break;
      case 'exportcsv': exportCSV(); break;
      case 'copyjson': copyJSON(); break;
      case 'pickfile': pickFile(); break;
      case 'importpaste': { var ta=document.querySelector('[data-inp="importtext"]'); if(ta){ try{ restoreState(JSON.parse(ta.value)); }catch(e){ toast('Invalid JSON'); } } break; }
      case 'togglelock': {
        if(state.settings.lock){ state.settings.lock=false; save(); render(); toast('Passcode off'); }
        else if(state.settings.pin){ state.settings.lock=true; unlocked=true; save(); render(); toast('Passcode on'); }
        else { ui.pinScreen=true; pinMode='set'; pinBuf=''; ui.pinErr=false; render(); }
        break;
      }
      case 'setpin': { ui.pinScreen=true; pinMode='set'; pinBuf=''; ui.pinErr=false; render(); break; }
      case 'pinkey': {
        if(a==='back'){ pinBuf=pinBuf.slice(0,-1); render(); break; }
        if(pinBuf.length<4) pinBuf+=a;
        if(pinBuf.length===4){
          if(pinMode==='set'){ state.settings.pin=pinBuf; state.settings.lock=true; unlocked=true; ui.pinScreen=false; pinMode='unlock'; pinBuf=''; save(); render(); toast('Passcode set'); }
          else { if(pinBuf===state.settings.pin){ unlocked=true; pinBuf=''; ui.pinErr=false; render(); } else { ui.pinErr=true; pinBuf=''; render(); } }
        } else render();
        break;
      }
      case 'cats': ui.modal='cats'; render(); break;
      case 'newcat': {
        if(ui.modal==='add'&&draft){ var ne=document.querySelector('[data-inp="note"]'); if(ne)draft.note=ne.value; ui.catReturn='add'; }
        else ui.catReturn='cats';
        catDraft={isNew:true,id:null,name:'',icon:(a==='income'?'cash':'cart'),color:'#12a277',type:a};
        ui.modal='catedit'; render(); break;
      }
      case 'catedit': { var c0=getCat(a); catDraft={isNew:false,id:c0.id,name:c0.name,icon:c0.icon,color:c0.color,type:c0.type}; ui.catReturn='cats'; ui.modal='catedit'; render(); break; }
      case 'pickicon': { var ne2=document.querySelector('[data-inp="catname"]'); if(ne2)catDraft.name=ne2.value; catDraft.icon=a; render(); break; }
      case 'pickcolor': { var ne3=document.querySelector('[data-inp="catname"]'); if(ne3)catDraft.name=ne3.value; catDraft.color=a; render(); break; }
      case 'catsave': {
        var ni=document.querySelector('[data-inp="catname"]'); if(ni)catDraft.name=ni.value;
        catDraft.name=(catDraft.name||'').trim()||'Untitled';
        if(catDraft.isNew){ var nid='c'+uid(); state.categories.push({id:nid,name:catDraft.name,icon:catDraft.icon,color:catDraft.color,type:catDraft.type}); rebuildCat(); if(ui.catReturn==='add'&&draft)draft.categoryId=nid; }
        else { var idx=state.categories.findIndex(function(x){return x.id===catDraft.id;}); if(idx>=0){ state.categories[idx].name=catDraft.name; state.categories[idx].icon=catDraft.icon; state.categories[idx].color=catDraft.color; } rebuildCat(); }
        save(); ui.modal=(ui.catReturn==='add'?'add':'cats'); render(); toast('Category saved'); break;
      }
      case 'catdelete': {
        var did=catDraft.id, fb=catDraft.type==='expense'?'other':'otherIncome';
        state.transactions.forEach(function(t){ if(t.categoryId===did)t.categoryId=fb; });
        delete state.budgets[did];
        state.categories=state.categories.filter(function(x){return x.id!==did;});
        rebuildCat(); save(); ui.modal='cats'; render(); toast('Category deleted'); break;
      }
      case 'key': commitAmountKey(a); break;
      case 'save': saveTxn(); break;
      case 'delete': deleteTxn(); break;
      case 'pickcat': draft.categoryId=a; document.getElementById('catrow').innerHTML=catrowHTML(); break;
      case 'pickacc': draft.accountId=a; document.getElementById('accrow').innerHTML=accRowHTML(a,'pickacc'); break;
      case 'pickfrom': draft.accountId=a; document.getElementById('fromrow').innerHTML=accRowHTML(a,'pickfrom'); break;
      case 'pickto': draft.toAccountId=a; document.getElementById('torow').innerHTML=accRowHTML(a,'pickto'); break;
      case 'dtype': if(draft.type!==a){ var noteEl=document.querySelector('[data-inp="note"]'); if(noteEl)draft.note=noteEl.value; draft.type=a;
        if(a!=='transfer'){ var list=catList(a); if(!list.some(function(c){return c.id===draft.categoryId;}))draft.categoryId=(list[0]||{id:'other'}).id; }
        else if(draft.accountId===draft.toAccountId){ var oth=state.accounts.find(function(x){return x.id!==draft.accountId;}); if(oth)draft.toAccountId=oth.id; }
        render(); } break;
      case 'date': { var d=parseISO(draft.date); d.setDate(d.getDate()+ (+a)); if(+a>0&&sod(d)>sod(new Date()))break; draft.date=iso(d); var lbl=document.getElementById('dateLbl'); if(lbl)lbl.textContent=friendly(draft.date); break; }
      case 'filter': ui.filter=a; render(); break;
      case 'month': { var na=+a; if(na>0&&ui.monthOff>=0)break; ui.monthOff=Math.min(0,ui.monthOff+na); render(); break; }
      case 'intype': ui.inType=a; render(); break;
      case 'budget': ui.modal='budget:'+a; render(); break;
      case 'budsave': { var v=Math.max(0,Math.round(+(document.querySelector('[data-inp="bud"]').value)||0)); if(v>0)state.budgets[a]=v; else delete state.budgets[a]; save(); ui.modal=null; render(); toast('Budget saved'); break; }
      case 'budremove': delete state.budgets[a]; save(); ui.modal=null; render(); toast('Budget removed'); break;
      case 'cur': { var parts=a.split('|'); state.settings.cur=parts[0]; state.settings.sym=parts[1]; save(); render(); break; }
      case 'loadsample': { seed().forEach(function(t){ state.transactions.push(t); }); sortT(); save(); ui.modal=null; render(); toast('Sample data added'); break; }
      case 'reset': { if(confirm('Delete all transactions, budgets and custom categories? This cannot be undone.')){ state=fresh(false); rebuildCat(); save(); ui.modal=null; ui.tab='home'; render(); toast('Reset complete'); } break; }
    }
  });
  document.addEventListener('input',function(e){
    var el=e.target.closest('[data-inp]'); if(!el)return; var k=el.getAttribute('data-inp');
    if(k==='q'){ ui.q=el.value; var c=document.getElementById('content'); ui.scrollTop=0; var pos=el.selectionStart; render(); var ni=document.querySelector('[data-inp="q"]'); if(ni){ ni.focus(); try{ni.setSelectionRange(pos,pos);}catch(_){} } }
  });
  document.addEventListener('change',function(e){
    var el=e.target.closest('[data-inp]'); if(!el)return; var k=el.getAttribute('data-inp');
    if(k==='name'){ state.settings.name=(el.value||'').trim()||'there'; save(); }
    else if(k==='mbudget'){ state.settings.monthlyBudget=Math.max(0,Math.round(+el.value||0)); save(); }
  });
  // stop backdrop close when tapping sheet
  document.addEventListener('click',function(e){ if(e.target.closest('[data-stop]')&&!e.target.closest('[data-act]')){ e.stopPropagation(); } },true);
  if(window.matchMedia){ try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){ if(state.settings.theme==='system')render(); }); }catch(_){} }

  load(); render();
})();
</script>
